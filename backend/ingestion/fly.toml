# Fly.io configuration for the ingestion service (WebSocket listener -> Redis Stream)
# Deploy with: flyctl launch  (first time)
#              flyctl deploy  (subsequent deploys)
#
# Secrets (never commit these — set via CLI):
#   flyctl secrets set ALPACA_API_KEY=xxx ALPACA_SECRET_KEY=xxx \
#     REDIS_HOST=127.0.0.1 REDIS_PORT=6379 REDIS_DB=0

app            = "sentient-trader-ingestion"
primary_region = "iad"   # US East — lowest latency to NYSE/NASDAQ data centers

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED  = "1"   # Ensures logs appear immediately in Fly.io dashboard
  REDIS_STREAM_KEY  = "market-news"

# No [[services]] block — this is a pure background worker with no HTTP port.
# Fly.io runs it as a persistent process, restarting automatically on crash.

[[vm]]
  size   = "shared-cpu-1x"  # Cheapest tier — plenty for a news poller
  memory = "256mb"

[[restart]]
  policy = "always"  # Restart automatically on crash or OOM
