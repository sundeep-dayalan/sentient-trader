# Fly.io configuration for the agent service (Kafka consumer → LangGraph → Alpaca)
# Deploy with: flyctl launch  (first time)
#              flyctl deploy  (subsequent deploys)
#
# Secrets (set via CLI — never commit):
#   flyctl secrets set GROQ_API_KEY=xxx ALPACA_API_KEY=xxx ALPACA_SECRET_KEY=xxx \
#     KAFKA_BOOTSTRAP_SERVER=xxx KAFKA_USERNAME=xxx KAFKA_PASSWORD=xxx \
#     KAFKA_TOPIC=market-news UPSTASH_REDIS_URL=xxx UPSTASH_REDIS_TOKEN=xxx \
#     SUPABASE_URL=xxx SUPABASE_SERVICE_ROLE_KEY=xxx

app            = "sentient-trader-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED         = "1"
  REDIS_STREAM_KEY         = "market-news"
  # Trading thresholds — tune these with `flyctl secrets set` without redeploying
  BUY_SENTIMENT_THRESHOLD  = "0.8"
  SELL_SENTIMENT_THRESHOLD = "-0.8"
  CONFIDENCE_THRESHOLD     = "0.9"
  ORDER_QUANTITY           = "1"
  GROQ_MODEL               = "llama-3.1-8b-instant"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  policy = "always"  # Restart automatically on crash or OOM
