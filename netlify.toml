[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/sentient-trader/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/sentient-trader/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────
# Applied to ALL responses. Prevents clickjacking, MIME sniffing,
# enforces HTTPS, and controls referrer leakage. (F-011)
#
# Content-Security-Policy notes:
#   - script-src 'unsafe-inline': the Vite entry inline bootstrap script.
#   - style-src 'unsafe-inline': styled components / runtime-injected styles.
#   - font/style googleapis|gstatic: the Google Fonts <link> in index.html.
#   - connect-src https:/wss:: the backend API, Supabase REST + realtime, and
#     PostHog are all env-driven HTTPS hosts, so we allow secure transports
#     rather than hardcoding origins that change per environment.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
