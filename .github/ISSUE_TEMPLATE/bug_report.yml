name: Bug report
description: Report a reproducible problem in the app, API, workers, or docs.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sentient Trader. Please do not include API keys, service-role keys, JWTs, private traces, or real account identifiers.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and the impact.
      placeholder: "The agent processed a simulated signal but..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Start Redis and the API
        2. Submit a simulated signal for AAPL
        3. Open the pipeline page
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend dashboard
        - Backend API
        - Agent worker
        - Ingestion worker
        - Supabase schema/queries
        - Deployment
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "I expected..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and account identifiers before pasting logs.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "main @ abc1234, v0.1.0, or unknown"
