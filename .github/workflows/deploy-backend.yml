name: Deploy Backend to Coolify

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.coolify.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

# Least privilege: deploy talks to Coolify via a webhook secret; the workflow
# itself only needs to read the repo. Actions pinned to commit SHAs.
permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/agent/requirements.txt pytest
      - name: Run agent test suite
        working-directory: backend/agent
        run: python -m pytest -q

  deploy-workers:
    name: Deploy Workers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Coolify compose file
        run: docker compose -f docker-compose.coolify.yml config
        env:
          REDIS_STREAM_KEY: market-news
          SUPABASE_DB_SCHEMA: sentient_trader
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: dummy
          UPSTASH_REDIS_URL: https://example.invalid
          UPSTASH_REDIS_TOKEN: dummy
          ALPACA_API_KEY: dummy
          ALPACA_SECRET_KEY: dummy
          GROQ_API_KEY: dummy

      - name: Check Coolify deployment secrets
        run: |
          test -n "$COOLIFY_WEBHOOK" || (echo "Missing repository secret: COOLIFY_WEBHOOK" && exit 1)
          test -n "$COOLIFY_TOKEN" || (echo "Missing repository secret: COOLIFY_TOKEN" && exit 1)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

      - name: Deploy to Coolify
        run: |
          curl --fail --show-error --silent \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
