name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Least privilege: every job only reads the repo. Actions are pinned to commit
# SHAs (tag comments alongside) so a hijacked tag can't inject code into CI.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/agent/requirements.txt pytest
      - name: Run agent test suite
        working-directory: backend/agent
        run: python -m pytest -q

  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/api/requirements.txt pytest
      - name: Run API test suite
        working-directory: backend/api
        run: python -m pytest -q

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit locked dependencies
        # Informational: surfaces CVEs without blocking a ship when no fix exists.
        continue-on-error: true
        run: |
          for svc in api agent ingestion; do
            echo "::group::pip-audit backend/$svc"
            pip-audit -r "backend/$svc/requirements.lock" || true
            echo "::endgroup::"
          done

  frontend-checks:
    name: Frontend typecheck + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev
