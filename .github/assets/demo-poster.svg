<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-label="Watch the live demo">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0e1c2c"/>
    </linearGradient>
    <linearGradient id="d-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="d-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="660" rx="16" fill="url(#d-bg)"/>
  <rect x="1" y="1" width="1278" height="658" rx="15" fill="none" stroke="#1c2c40" stroke-width="2"/>

  <!-- window chrome -->
  <g>
    <rect x="0" y="0" width="1280" height="52" rx="16" fill="#0c1726"/>
    <rect x="0" y="36" width="1280" height="16" fill="#0c1726"/>
    <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="26" r="6" fill="#febc2e"/>
    <circle cx="72" cy="26" r="6" fill="#28c840"/>
    <text x="110" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="14"
          fill="#5b7290">sentient-trader · live dashboard</text>
    <circle cx="1180" cy="26" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1196" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="13"
          fill="#7d93ab" font-weight="600">LIVE</text>
  </g>

  <!-- faux signal cards -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <g transform="translate(40,84)">
      <rect width="360" height="70" rx="10" fill="#0f1d2e" stroke="#1d2f45"/>
      <rect x="16" y="22" width="46" height="26" rx="6" fill="#14331f"/>
      <text x="39" y="40" text-anchor="middle" font-size="14" fill="#34d27b" font-weight="700">BUY</text>
      <text x="78" y="32" font-size="14" fill="#cdd9e6" font-weight="600">NVDA</text>
      <text x="78" y="52" font-size="12" fill="#5b7290">conviction 0.91 · sentiment +0.83</text>
    </g>
    <g transform="translate(40,166)">
      <rect width="360" height="70" rx="10" fill="#0f1d2e" stroke="#1d2f45"/>
      <rect x="16" y="22" width="46" height="26" rx="6" fill="#33231b"/>
      <text x="39" y="40" text-anchor="middle" font-size="14" fill="#f0a868" font-weight="700">HOLD</text>
      <text x="78" y="32" font-size="14" fill="#cdd9e6" font-weight="600">TSLA</text>
      <text x="78" y="52" font-size="12" fill="#5b7290">risk-gated · low catalyst score</text>
    </g>
    <g transform="translate(40,248)" opacity="0.6">
      <rect width="360" height="70" rx="10" fill="#0f1d2e" stroke="#1d2f45"/>
      <rect x="16" y="22" width="46" height="26" rx="6" fill="#14331f"/>
      <text x="39" y="40" text-anchor="middle" font-size="14" fill="#34d27b" font-weight="700">BUY</text>
      <text x="78" y="32" font-size="14" fill="#cdd9e6" font-weight="600">GOOG</text>
      <text x="78" y="52" font-size="12" fill="#5b7290">bracket · TP +6% · SL −3%</text>
    </g>
  </g>

  <!-- faux equity chart -->
  <g transform="translate(440,84)">
    <rect width="800" height="500" rx="12" fill="#0c1828" stroke="#1d2f45"/>
    <path d="M40,360 L140,330 L240,344 L340,280 L440,300 L540,232 L640,250 L740,170"
          fill="none" stroke="url(#d-accent)" stroke-width="3" stroke-linecap="round"
          filter="url(#d-glow)" stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- centered play button -->
  <g transform="translate(640,330)">
    <circle r="62" fill="#0b1626" stroke="url(#d-accent)" stroke-width="3" filter="url(#d-glow)">
      <animate attributeName="r" values="60;66;60" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M-18,-26 L34,0 L-18,26 Z" fill="#e8f3ff"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="640" y="446" font-size="26" font-weight="700" fill="#e8f3ff">Watch the Live Demo</text>
    <text x="640" y="476" font-size="14" fill="#5b7290">signals stream in · the committee debates · trades fire in real time</text>
  </g>
</svg>
