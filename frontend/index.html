<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Autonomous AI trading agent powered by LangGraph, LLM routing, Alpaca, and Valkey"
    />
    <title>Sentient Trader — AI Market Intelligence</title>
    <!-- Load fonts in parallel via <link> (not a CSS @import) so the app's
         stylesheet applies immediately and doesn't flash unstyled while the
         fonts download. display=swap lets text render in a fallback first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    />
    <script>
      (function () {
        try {
          if (localStorage.getItem('st-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
