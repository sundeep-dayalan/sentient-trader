services:
  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '${PORT:-8000}'
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:3000}'
      REDIS_STREAM_KEY: '${REDIS_STREAM_KEY:-market-news}'
      REDIS_HOST: '${REDIS_HOST:-127.0.0.1}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_USERNAME: '${REDIS_USERNAME:-}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      WORKER_HEALTH_KEY: '${WORKER_HEALTH_KEY:-sentient:workers:health}'
      AGENT_WORKER_NAME: '${AGENT_WORKER_NAME:-agent}'
      SUPABASE_DB_SCHEMA: '${SUPABASE_DB_SCHEMA:-sentient_trader}'
      SUPABASE_URL: '${SUPABASE_URL}'
      SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPER_USER_EMAILS: '${SUPER_USER_EMAILS:-}'
      ALPACA_API_KEY: '${ALPACA_API_KEY}'
      ALPACA_SECRET_KEY: '${ALPACA_SECRET_KEY}'
      ALPACA_BASE_URL: '${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}'
      GROQ_API_KEY: '${GROQ_API_KEY:-}'

  ingestion:
    build:
      context: ./backend
      dockerfile: ingestion/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', 'healthcheck.py']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_STREAM_KEY: '${REDIS_STREAM_KEY:-market-news}'
      REDIS_HOST: '${REDIS_HOST:-127.0.0.1}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_USERNAME: '${REDIS_USERNAME:-}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      WORKER_HEALTH_KEY: '${WORKER_HEALTH_KEY:-sentient:workers:health}'
      INGESTION_WORKER_NAME: '${INGESTION_WORKER_NAME:-ingestion}'
      SUPABASE_DB_SCHEMA: '${SUPABASE_DB_SCHEMA:-sentient_trader}'
      SUPABASE_URL: '${SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      ALPACA_API_KEY: '${ALPACA_API_KEY}'
      ALPACA_SECRET_KEY: '${ALPACA_SECRET_KEY}'
      ALPACA_TRADING_BASE_URL: '${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets}'
      TICKER_META_HASH_KEY: '${TICKER_META_HASH_KEY:-sentient:ticker:meta}'
      TICKER_DIRECTORY_STATE_KEY: '${TICKER_DIRECTORY_STATE_KEY:-sentient:ticker:directory:state}'
      TICKER_ALIAS_OVERRIDES_KEY: '${TICKER_ALIAS_OVERRIDES_KEY:-sentient:ticker:alias-overrides}'
      TICKER_DIRECTORY_REFRESH_SECONDS: '${TICKER_DIRECTORY_REFRESH_SECONDS:-86400}'
      TICKER_DIRECTORY_REFRESH_CHECK_SECONDS: '${TICKER_DIRECTORY_REFRESH_CHECK_SECONDS:-60}'
      TICKER_PUBLISH_SCORE_THRESHOLD: '${TICKER_PUBLISH_SCORE_THRESHOLD:-80}'

  agent:
    build:
      context: ./backend
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', 'healthcheck.py']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_STREAM_KEY: '${REDIS_STREAM_KEY:-market-news}'
      REDIS_HOST: '${REDIS_HOST:-127.0.0.1}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_USERNAME: '${REDIS_USERNAME:-}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_CONSUMER_START_ID: '${REDIS_CONSUMER_START_ID:-0}'
      WORKER_HEALTH_KEY: '${WORKER_HEALTH_KEY:-sentient:workers:health}'
      AGENT_WORKER_NAME: '${AGENT_WORKER_NAME:-agent}'
      AGENT_MAX_TRADE_SIGNAL_AGE_SECONDS: '${AGENT_MAX_TRADE_SIGNAL_AGE_SECONDS:-900}'
      AGENT_MAX_AUDIT_SIGNAL_AGE_SECONDS: '${AGENT_MAX_AUDIT_SIGNAL_AGE_SECONDS:-86400}'
      AGENT_MAX_PROCESSING_ATTEMPTS: '${AGENT_MAX_PROCESSING_ATTEMPTS:-3}'
      AGENT_RETRY_BASE_DELAY_SECONDS: '${AGENT_RETRY_BASE_DELAY_SECONDS:-30}'
      AGENT_RETRY_MAX_DELAY_SECONDS: '${AGENT_RETRY_MAX_DELAY_SECONDS:-300}'
      AGENT_RETRY_BATCH_SIZE: '${AGENT_RETRY_BATCH_SIZE:-5}'
      AGENT_PENDING_IDLE_SECONDS: '${AGENT_PENDING_IDLE_SECONDS:-60}'
      AGENT_PENDING_BATCH_SIZE: '${AGENT_PENDING_BATCH_SIZE:-5}'
      SUPABASE_DB_SCHEMA: '${SUPABASE_DB_SCHEMA:-sentient_trader}'
      SUPABASE_URL: '${SUPABASE_URL}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      ALPACA_API_KEY: '${ALPACA_API_KEY}'
      ALPACA_SECRET_KEY: '${ALPACA_SECRET_KEY}'
      GROQ_API_KEY: '${GROQ_API_KEY}'
      LANGSMITH_TRACING: '${LANGSMITH_TRACING:-}'
      LANGSMITH_ENDPOINT: '${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}'
      LANGSMITH_API_KEY: '${LANGSMITH_API_KEY:-}'
      LANGSMITH_PROJECT: '${LANGSMITH_PROJECT:-}'
