services:
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_API_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      REDIS_STREAM_KEY: "${REDIS_STREAM_KEY:-market-news}"
      REDIS_HOST: "${REDIS_HOST:-127.0.0.1}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_USERNAME: "${REDIS_USERNAME:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      SUPABASE_DB_SCHEMA: "${SUPABASE_DB_SCHEMA:-sentient_trader}"
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL in Coolify}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in Coolify}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in Coolify}"
      SUPER_USER_EMAILS: "${SUPER_USER_EMAILS:-}"
      ALPACA_API_KEY: "${ALPACA_API_KEY:?set ALPACA_API_KEY in Coolify}"
      ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:?set ALPACA_SECRET_KEY in Coolify}"
      ALPACA_BASE_URL: "${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"

  ingestion:
    build:
      context: ./backend/ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_STREAM_KEY: "${REDIS_STREAM_KEY:-market-news}"
      REDIS_HOST: "${REDIS_HOST:-127.0.0.1}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_USERNAME: "${REDIS_USERNAME:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      ALPACA_API_KEY: "${ALPACA_API_KEY:?set ALPACA_API_KEY in Coolify}"
      ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:?set ALPACA_SECRET_KEY in Coolify}"

  agent:
    build:
      context: ./backend/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_STREAM_KEY: "${REDIS_STREAM_KEY:-market-news}"
      REDIS_HOST: "${REDIS_HOST:-127.0.0.1}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_USERNAME: "${REDIS_USERNAME:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      SUPABASE_DB_SCHEMA: "${SUPABASE_DB_SCHEMA:-sentient_trader}"
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL in Coolify}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in Coolify}"
      ALPACA_API_KEY: "${ALPACA_API_KEY:?set ALPACA_API_KEY in Coolify}"
      ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:?set ALPACA_SECRET_KEY in Coolify}"
      GROQ_API_KEY: "${GROQ_API_KEY:?set GROQ_API_KEY in Coolify}"
