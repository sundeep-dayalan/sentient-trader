# Prometheus alert rules for the /metrics endpoint exposed by backend/api.
#
# Load these into the scraper that already collects /metrics (Grafana Cloud:
# paste under Alerts → Alert rules, or mount into a self-hosted Prometheus
# via `rule_files`). Thresholds mirror the staleness windows the API itself
# uses (WORKER_STALE_AFTER_SECONDS=180).
groups:
  - name: sentient-trader
    rules:
      - alert: WorkerDown
        expr: sentient_worker_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Worker {{ $labels.worker }} is down or unhealthy'
          description: >-
            Heartbeat for {{ $labels.worker }} is stale (>180s) or its status
            is not "healthy". The trading pipeline is not processing signals.

      - alert: WorkerHeartbeatStale
        expr: sentient_worker_heartbeat_age_seconds > 180
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'Worker {{ $labels.worker }} heartbeat is stale'
          description: >-
            Last heartbeat is {{ $value }}s old. The worker may be wedged on a
            blocking call even though the process is alive.

      - alert: MetricsScrapeFailing
        expr: sentient_metrics_scrape_ok == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API cannot read worker health from Redis'
          description: >-
            /metrics is reachable but Redis worker-health reads are failing —
            Redis is likely down, which also halts the consumer.

      - alert: DeadLetterQueueGrowing
        expr: delta(sentient_dlq_depth[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Signals are being dead-lettered'
          description: >-
            The agent DLQ grew in the last 30 minutes. Inspect the dead-letter
            stream for the failure reason (malformed payloads, repeated
            processing errors, expired signals).

      - alert: RetryQueueBacklog
        expr: sentient_retry_queue_depth > 25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Agent retry queue is backing up'
          description: >-
            More than 25 signals are waiting on retry — a downstream dependency
            (Supabase, Alpaca, LLM provider) is likely failing repeatedly.

      - alert: LLMBudgetExhausted
        expr: sentient_llm_budget_exhausted == 1
        labels:
          severity: warning
        annotations:
          summary: 'Daily LLM call budget exhausted'
          description: >-
            The agent has hit its daily LLM call budget; signals fall back to
            budget pre-screen HOLDs until the UTC day rolls over.

  # ── Safety invariants (published by the position monitor's worker health) ──
  # These four rules exist because every mechanism failure in the Bug Log
  # (dead reaper, naked positions, wedged monitor, zombie orders) violated one
  # of them within hours while staying invisible in logs for days or weeks.
  - name: sentient-trader-invariants
    rules:
      - alert: PositionMonitorSilent
        expr: >-
          absent(sentient_worker_up{worker="position-monitor"})
          or sentient_worker_heartbeat_age_seconds{worker="position-monitor"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Position monitor is not running'
          description: >-
            No fresh heartbeat from the position-monitor safety loop (stops,
            time exits, reaper, reconciliation). Positions are unmanaged.
            This exact condition went unnoticed for days before
            BUG-2026-07-13-01; it must page immediately.

      - alert: NakedPositions
        expr: sentient_worker_positions_without_stop{worker="position-monitor"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $value }} position(s) have no protective stop'
          description: >-
            At least one open position has every share unheld by any working
            order — i.e. no stop-loss exists (BUG-2026-07-01-01 /
            BUG-2026-07-10-05 class). The 5-minute reconciliation sweep should
            self-heal this; if it persists 15m, the sweep itself is failing.

      - alert: ZombieEntryOrders
        expr: sentient_worker_stale_entry_orders{worker="position-monitor"} > 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} stale unfilled entry order(s) working'
          description: >-
            Unfilled *_to_open orders older than the 10-minute reap policy are
            still live (BUG-2026-06-08-02 / BUG-2026-07-13-02 class). They can
            fill days later on dead news. The reaper should clear these every
            minute; persistence means it is broken again.

      - alert: PositionBookRunaway
        expr: sentient_worker_open_positions{worker="position-monitor"} > 25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Open position count is {{ $value }} — time-based exit may be dead'
          description: >-
            With a 1-hour max hold the book should stay small. A sustained
            large book reproduces the pre-fix state where time_based_exit was
            enabled but never fired for 18 days.
